services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: silas-postgres
    environment:
      POSTGRES_USER: silas_admin
      POSTGRES_PASSWORD: silas_secret_password
      POSTGRES_DB: silas_db
    ports:
      - "5432:5432"
    volumes:
      - silas_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: silas-redis
    ports:
      - "6379:6379"

volumes:
  silas_pgdata:
